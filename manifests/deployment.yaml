apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-k8s-troubleshooter
  labels:
    app: ai-k8s-troubleshooter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-k8s-troubleshooter
  template:
    metadata:
      labels:
        app: ai-k8s-troubleshooter
    spec:
      containers:
        - name: api
          image: ghcr.io/artsiomrudenia/ai-k8s-troubleshooter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-k8s-troubleshooter
spec:
  selector:
    app: ai-k8s-troubleshooter
  ports:
    - name: http
      port: 80
      targetPort: 8080
